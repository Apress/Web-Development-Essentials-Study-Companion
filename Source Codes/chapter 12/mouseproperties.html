<!DOCTYPE html>
<html>
<head>
    <title>Mouse Properties</title>
<style>
.btn {
width:200px;
height:100px;
background:lightblue;
}
</style>
</head>
<body>

<button id="b1" class="btn">
  Move mouse here
</button>
<button id="b2" class="btn">
  Move mouse here
</button>
<script>
const btns = document.getElementsByClassName("btn");

btns[0].onmouseover = function () {
  btns[0].style.background = "orange";
};

btns[0].onmouseout = function () {
  btns[0].style.background = "lightblue";
};
</script>

</body>
</html>
