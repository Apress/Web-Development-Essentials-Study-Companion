<!DOCTYPE html>
<html>
  <head>
<link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Flexbox Example</h1>
<div class="profile">
  <h1>Grid Form Example</h1>

  <div class="profile">
    <h2>User Profile</h2>

    <form>
      <div class="form-row">
        <label for="fullname">Full Name</label>
        <input id="fullname" name="fullname" type="text" placeholder="Enter your name">
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Your email">
      </div>

      <div class="form-row">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="Enter phone number">
      </div>

      <div class="form-row">
        <label for="about">About you</label>
        <textarea id="about" name="about" placeholder="Describe yourself"></textarea>
      </div>

      <div class="form-actions">
        <button type="button">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</body>


</html>
