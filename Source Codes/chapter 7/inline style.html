<!DOCTYPE html>
<html>
  <head>
<!-- style element -->    
<style>
    div {
        background: grey;
        border: 2px;
    }
    p {
        color: white;
        text-align: center;
    }
</style>
</head>

  <body>
<!-- inline style  -->
<div style="background: grey; border: 2px">
  <p style="color:white; text-align: center">
    Hello, World!
  </p>
</div>
<!-- useing style element -->
<div>
  <p>
    Hello, World!
  </p>
</div>

  </body>
</html>
