<html>
<body>
<h2>JavaScript in Body</h2>
	<script>
let num;

num = prompt("enter a number");

if (num%2==0) {
  if (num%3==0) {
    document.write (`${num} is divisible by 3 and 2`);
  } else {
    document.write (`${num} is divisible by 2 but not by 3`);
  }  
} else {
  if (num%3==0) {
  document.write (`${num} is divisible by 3 but not by 2`);
} else {
  document.write (`${num} is neither divisible by 2 nor by 3`);
  }
} 



	</script>
<h2>JavaScript in Body</h2>
</body>
</html>
