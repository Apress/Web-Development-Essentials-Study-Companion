<html>
<body>
	<script>

        let marks, grade;
        marks = prompt("enter your marks");
        if (marks<50) 
        grade = "F";
        else if (marks<60) 
        grade = "B";
        else if (marks<75) 
        grade = "B+";
        else if (marks<90) 
        grade = "A";
        else 
        grade = "A+";

        document.write (`Marks: ${marks}. Your grade is ${grade}`);

	</script>

</body>
</html>
